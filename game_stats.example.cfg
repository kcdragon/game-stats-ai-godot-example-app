; Copy this file to game_stats.cfg and fill in your values.
; game_stats.cfg is gitignored, so your credentials stay out of the repository.
; Both values are on your API tokens page: https://gamestats.ai/api_tokens
; Use a client token: it ships inside the game, and it can only send events.

[game_stats]

account_id="your_account_id"
api_token="client_your_token"
